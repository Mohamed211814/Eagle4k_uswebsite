<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#080A12" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06080D" stop-opacity="1"/>
    </radialGradient>

    <!-- Border Gradient: Yellow-Gold to Aqua-Cyan -->
    <linearGradient id="borderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="35%" stop-color="#FFB700"/>
      <stop offset="70%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#70FFFF"/>
    </linearGradient>

    <!-- TV Icon Yellow-Gold Gradient -->
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>

    <!-- Drop Glow for TV icon -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="512" height="512" rx="120" fill="#06080D"/>
  
  <!-- Outer Glow behind squircle bottom -->
  <ellipse cx="256" cy="450" rx="160" ry="50" fill="#FF9900" opacity="0.22" filter="blur(30px)"/>

  <!-- Squircle Outer Border -->
  <rect x="52" y="52" width="408" height="408" rx="108" 
        fill="none" 
        stroke="url(#borderGrad)" 
        stroke-width="26" 
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Dark Mask -->
  <rect x="65" y="65" width="382" height="382" rx="95" fill="#080A12"/>

  <!-- Inner Bottom Glow -->
  <rect x="65" y="65" width="382" height="382" rx="95" fill="url(#bgGlow)"/>

  <!-- TV Icon Group with Glow -->
  <g filter="url(#goldGlow)">
    <!-- Antenna (V-Shape sticking out of top center of TV screen) -->
    <path d="M 210 162 L 246 198 M 302 162 L 266 198" 
          stroke="url(#tvGrad)" 
          stroke-width="20" 
          stroke-linecap="round"/>

    <!-- TV Body (Rounded Rectangle) -->
    <rect x="154" y="198" width="204" height="148" rx="36" 
          fill="none" 
          stroke="url(#tvGrad)" 
          stroke-width="20"
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>